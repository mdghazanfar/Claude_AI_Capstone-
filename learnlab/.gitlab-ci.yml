stages:
  - test
  - agent-evaluate

backend_test:
  stage: test
  image: python:3.12
  script:
    - cd backend
    - pip install -r requirements.txt
    - pytest --cov=src

frontend_test:
  stage: test
  image: node:20
  script:
    - cd frontend
    - npm install
    - npm run test

claude_code_action:
  stage: agent-evaluate
  image: node:20
  script:
    - npm install -g @anthropic-ai/claude-code
    - echo "Running Claude Code autonomous evaluation..."
    - claude --evaluator-mode --target learnlab
  only:
    - merge_requests
